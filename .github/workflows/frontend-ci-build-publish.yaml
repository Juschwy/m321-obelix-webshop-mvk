name: Frontend CI - Build & Publish

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs: { }

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend/obelix-webshop-frontend

      - name: Run frontend tests
        id: tests
        continue-on-error: true
        run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: ./frontend/obelix-webshop-frontend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE variable
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/frontend:latest" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t "$IMAGE" ./frontend/obelix-webshop-frontend

      - name: Push Docker image
        if: steps.tests.outcome == 'success'
        run: docker push "$IMAGE"
