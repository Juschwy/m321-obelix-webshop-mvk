name: Frontend CI - Build & Publish

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs: {
      image_registry:
        description: 'Override IMAGE_REGISTRY (e.g. ghcr.io/owner/repo)'
        type: string
        required: false
    }

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend/obelix-webshop-frontend

      - name: Run frontend tests
        id: tests
        continue-on-error: true
        run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: ./frontend/obelix-webshop-frontend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image registry
        shell: bash
        env:
          IMAGE_REGISTRY_INPUT: ${{ inputs.image_registry }}
        run: |
          set -euo pipefail
          
          raw_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          branch_tag="$(printf '%s' "$raw_ref" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          sha_short="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
          ts_utc="$(date -u +%Y%m%d%H%M%S)"
          if [[ -z "$branch_tag" ]]; then
            branch_tag="unknown-${sha_short}"
          fi
          image_tag_version="${branch_tag}_${sha_short}_${ts_utc}"
          
          {
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY_INPUT:-ghcr.io/juschwy/m321-obelix-webshop-mvk}"
            echo "IMAGE_TAG_VERSION=${image_tag_version}"
          } >> "$GITHUB_ENV"

      - name: Set IMAGE env var
        run: echo "IMAGE=${IMAGE_REGISTRY}/frontend:${IMAGE_TAG_VERSION}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t "$IMAGE" ./frontend/obelix-webshop-frontend

      - name: Push Docker image
        if: steps.tests.outcome == 'success'
        run: docker push "$IMAGE"
