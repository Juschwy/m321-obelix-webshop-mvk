name: Backend CI - Build & Publish
permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
  pull_request:
    types:
      [opened, synchronize, reopened]
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs: { }

jobs:
  test:
    if: ${{ false }} # disable, will be removed later on
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: ./gradlew --no-daemon test
        working-directory: ./backend

      - name: Upload test results (artifact)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/test-results/**

      - name: Publish test report to Checks
        if: ${{ always() }}
        uses: dorny/test-reporter@v1
        with:
          name: backend-tests
          path: backend/build/test-results/**/*.xml
          reporter: java-junit

  build-and-push:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master'))
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Docker login to GHCR
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image with Gradle (PRs)
        if: github.event_name == 'pull_request'
        run: ./gradlew bootBuildImage --imageName ghcr.io/${{ github.repository }}/backend
        working-directory: ./backend

      - name: Build and push image with Gradle (push)
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        run: ./gradlew bootBuildImage --imageName ghcr.io/${{ github.repository }}/backend --publishImage
        working-directory: ./backend
