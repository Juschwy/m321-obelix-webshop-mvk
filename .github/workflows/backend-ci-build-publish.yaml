name: Backend CI - Build & Publish
permissions:
  contents: read
  packages: write
  checks: write

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
  pull_request:
    types:
      [opened, synchronize, reopened]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: ./gradlew --no-daemon test
        working-directory: ./backend

      - name: Upload test results (artifact)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/build/test-results/**

      - name: Publish test report to Checks
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        uses: dorny/test-reporter@v1
        with:
          name: backend-tests
          path: backend/**/build/test-results/**/*.xml
          reporter: java-junit

  build-and-push:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'master')
    needs: test
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set image registry
        run: echo "IMAGE_REGISTRY=ghcr.io/juschwy/m321-obelix-webshop-mvk" >> "$GITHUB_ENV"

      - name: Docker login to GHCR
        if: github.event_name == 'push' && github.ref_name == 'master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images with Gradle (no publish)
        if: github.event_name == 'pull_request'
        run: ./gradlew :obelix-quarry-impl:bootBuildImage :obelix-basket-impl:bootBuildImage :obelix-webshop:bootBuildImage
        working-directory: ./backend

      - name: Build and push images with Gradle (publish)
        if: github.event_name == 'push' && github.ref_name == 'master'
        run: ./gradlew :obelix-quarry-impl:bootBuildImage --publishImage :obelix-basket-impl:bootBuildImage --publishImage :obelix-webshop:bootBuildImage --publishImage
        working-directory: ./backend
