ext.configureBootBuildImageVersioning = { TaskProvider taskProvider, String serviceImageName, String localFallbackImageName ->
	taskProvider.configure { task ->
		def registry = System.getenv("IMAGE_REGISTRY")
		def baseName = registry ? "${registry}/${serviceImageName}" : localFallbackImageName

		def versionTagValue = System.getenv("IMAGE_TAG_VERSION")
		def aliasTagValue = System.getenv("IMAGE_TAG_ALIAS")
		def defaultTagValue = System.getenv("IMAGE_TAG_DEFAULT") ?: "dev"
		imageName = "${baseName}:${versionTagValue ?: defaultTagValue}"
		if (aliasTagValue) {
			tags.add("${baseName}:${aliasTagValue}")
		}
	}
}
